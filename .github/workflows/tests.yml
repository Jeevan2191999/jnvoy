name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jnvoy
          POSTGRES_PASSWORD: jnvoy
          POSTGRES_DB: jnvoy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jnvoy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://jnvoy:jnvoy@localhost:5432/jnvoy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m spacy download en_core_web_lg && python -m spacy download en_core_web_sm
      - run: pytest -q
