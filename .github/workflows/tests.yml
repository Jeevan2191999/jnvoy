name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jnvoy
          POSTGRES_PASSWORD: jnvoy
          POSTGRES_DB: jnvoy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jnvoy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://jnvoy:jnvoy@localhost:5432/jnvoy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m spacy download en_core_web_lg && python -m spacy download en_core_web_sm
      - run: pytest -q

  # Builds the Docker image and starts it, so a broken Dockerfile or a missing file is found
  # here and not after a deploy.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jnvoy-ci .
      - name: Start it and check it answers
        run: |
          docker run -d --name jnvoy -p 8000:8000 \
            -e JNVOY_API_KEYS=ci-key-ci-key-ci-key-ci-key-ci-key \
            jnvoy-ci
          for i in $(seq 1 40); do
            if curl -fs http://localhost:8000/health | grep -q healthy; then echo "up after $i tries"; exit 0; fi
            sleep 3
          done
          docker logs jnvoy
          exit 1
      - name: A scan works inside the container
        run: |
          curl -fs -X POST http://localhost:8000/v1/scan \
            -H "x-api-key: ci-key-ci-key-ci-key-ci-key-ci-key" -H "content-type: application/json" \
            -d '{"text":"Email anna.lee@example.com"}' | grep -q EMAIL_ADDRESS
