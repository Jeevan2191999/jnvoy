name: audit

# Every Monday (and whenever you press "Run workflow"): check every pinned dependency against
# the public vulnerability databases. A red run means a pinned version has a known problem.
# GitHub emails the repository owner when a scheduled run fails.
#
# Three cryptography advisories are ignored on purpose. Presidio requires cryptography below 49,
# so the fixed versions cannot be installed yet, and the affected code (certificate chain
# verification and PKCS7 decryption) is not used by Jnvoy. Remove the ignores once Presidio
# allows cryptography 49 or newer.

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: |
          pip-audit -r requirements.txt --no-deps \
            --ignore-vuln PYSEC-2026-3552 \
            --ignore-vuln PYSEC-2026-3553 \
            --ignore-vuln PYSEC-2026-3554
