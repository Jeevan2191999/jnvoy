version: '3.9'

# Jnvoy AI Privacy Firewall - Full Stack
# Starts: API + PostgreSQL in one command
# Setup:  cp .env.example .env, set your keys in .env, then run: docker-compose up

services:

  # ── Jnvoy API ──────────────────────────────────────────────────────────────
  api:
    build: .
    container_name: jnvoy-api
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - JNVOY_API_KEYS=${JNVOY_API_KEYS:?Set JNVOY_API_KEYS in your .env file (see .env.example)}
      - JNVOY_ADMIN_KEYS=${JNVOY_ADMIN_KEYS:-}
      - DATABASE_URL=postgresql://jnvoy:jnvoy@postgres:5432/jnvoy
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── PostgreSQL (audit log and compliance data) ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: jnvoy-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=jnvoy
      - POSTGRES_PASSWORD=jnvoy
      - POSTGRES_DB=jnvoy
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jnvoy"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
